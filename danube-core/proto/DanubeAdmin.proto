syntax = "proto3";

package danube_admin;

// Keep enums/messages consistent with danube/DanubeApi.proto
enum DispatchStrategy {
  NonReliable = 0;
  Reliable = 1;
}

enum SubscriptionBackoffStrategy {
  Fixed = 0;
  Exponential = 1;
}

enum SubscriptionPoisonPolicy {
  DeadLetter = 0;
  Block = 1;
  Drop = 2;
}

// Retention policy and reliable options are removed in Phase 1; use DispatchStrategy only

service BrokerAdmin {
  // Broker related RPCs
  rpc ListBrokers(Empty) returns (BrokerListResponse);
  rpc GetLeaderBroker(Empty) returns (BrokerResponse);
  rpc ListNamespaces(Empty) returns (NamespaceListResponse);
  rpc UnloadBroker(UnloadBrokerRequest) returns (UnloadBrokerResponse);
  rpc ActivateBroker(ActivateBrokerRequest) returns (ActivateBrokerResponse);
  
  // Load Balancing & Rebalancing RPCs (Phase 3)
  rpc GetClusterBalance(ClusterBalanceRequest) returns (ClusterBalanceResponse);
  rpc TriggerRebalance(RebalanceRequest) returns (RebalanceResponse);

  // In-memory diagnostics (logs and metrics ring buffers)
  rpc GetBrokerLogs(GetBrokerLogsRequest) returns (GetBrokerLogsResponse);
  rpc GetMetricsSnapshot(GetMetricsSnapshotRequest) returns (GetMetricsSnapshotResponse);
}

// Raft cluster membership management.
// These RPCs are forwarded to the Raft leader internally.
service ClusterAdmin {
  // Show Raft cluster state: leader, term, log index, voter/learner sets.
  rpc ClusterStatus(Empty) returns (ClusterStatusResponse);

  // Add a node as a Raft learner (non-voting). It will receive snapshots + log.
  rpc AddNode(AddNodeRequest) returns (AddNodeResponse);

  // Promote a learner to a full voting member.
  rpc PromoteNode(PromoteNodeRequest) returns (PromoteNodeResponse);

  // Remove a node from the Raft voter/learner set.
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);

  // Configure or swap cluster object store after pre-flight probe.
  rpc ConfigureObjectStore(ConfigureObjectStoreRequest) returns (ConfigureObjectStoreResponse);

  // Inspect active cluster object store configuration.
  rpc GetObjectStoreConfig(Empty) returns (ObjectStoreConfigResponse);

  // Plan declarative desired-state changes (dry-run diff).
  rpc PlanDesiredState(DesiredStateRequest) returns (DesiredStatePlanResponse);

  // Apply declarative desired-state manifest safely.
  rpc ApplyDesiredState(DesiredStateRequest) returns (DesiredStateApplyResponse);

  // Self-join an existing cluster with automatic voter target cap.
  rpc JoinCluster(JoinClusterRequest) returns (JoinClusterResponse);
}

service NamespaceAdmin {
  // Namespace related RPCs
  rpc GetNamespaceTopics(NamespaceRequest) returns (TopicListResponse);
  rpc GetNamespacePolicies(NamespaceRequest) returns (PolicyResponse);
  rpc CreateNamespace(NamespaceRequest) returns (NamespaceResponse);
  rpc DeleteNamespace(NamespaceRequest) returns (NamespaceResponse);
}

service TopicAdmin {
  // Topic related RPCs
  rpc ListNamespaceTopics(NamespaceRequest) returns (TopicInfoListResponse);
  rpc ListBrokerTopics(BrokerRequest) returns (TopicInfoListResponse);
  rpc CreateTopic(NewTopicRequest) returns (TopicResponse);
  rpc CreatePartitionedTopic(PartitionedTopicRequest) returns (TopicResponse);
  rpc DeleteTopic(TopicRequest) returns (TopicResponse);
  rpc UnloadTopic(TopicRequest) returns (TopicResponse);
  rpc ListSubscriptions(TopicRequest) returns (SubscriptionListResponse);
  rpc Unsubscribe(SubscriptionRequest) returns (SubscriptionResponse);
  rpc SetSubscriptionFailurePolicy(SetSubscriptionFailurePolicyRequest) returns (SubscriptionResponse);
  rpc GetSubscriptionFailurePolicy(GetSubscriptionFailurePolicyRequest) returns (GetSubscriptionFailurePolicyResponse);
  rpc DescribeTopic(DescribeTopicRequest) returns (DescribeTopicResponse);
  rpc SetSubscriptionDispatchConfig(SetSubscriptionDispatchConfigRequest) returns (SubscriptionResponse);
  rpc GetSubscriptionDispatchConfig(GetSubscriptionDispatchConfigRequest) returns (GetSubscriptionDispatchConfigResponse);
  rpc UpdateTopicStorageMode(UpdateTopicStorageModeRequest) returns (TopicResponse);

  // Diagnostic & schema inference RPCs
  rpc PeekMessages(PeekMessagesRequest) returns (PeekMessagesResponse);
  rpc GetTopicTimeRange(TopicRequest) returns (GetTopicTimeRangeResponse);
  rpc SampleTopicJson(SampleTopicJsonRequest) returns (SampleTopicJsonResponse);
  rpc ExplainConsumerStall(ExplainConsumerStallRequest) returns (ExplainConsumerStallResponse);
  rpc InferTopicSchema(InferTopicSchemaRequest) returns (InferTopicSchemaResponse);
  rpc BranchTopic(BranchTopicRequest) returns (BranchTopicResponse);
  rpc SeekSubscription(SeekSubscriptionRequest) returns (SeekSubscriptionResponse);
  rpc ReplayDlq(ReplayDlqRequest) returns (ReplayDlqResponse);
}

// ─── Security / Authorization Admin ──────────────────────────────────────────

service SecurityAdmin {
  // Roles
  rpc CreateRole(CreateRoleRequest)     returns (CreateRoleResponse);
  rpc GetRole(GetRoleRequest)           returns (GetRoleResponse);
  rpc ListRoles(Empty)                  returns (ListRolesResponse);
  rpc DeleteRole(DeleteRoleRequest)     returns (DeleteRoleResponse);

  // Bindings
  rpc CreateBinding(CreateBindingRequest) returns (CreateBindingResponse);
  rpc GetBinding(GetBindingRequest)       returns (GetBindingResponse);
  rpc ListBindings(ListBindingsRequest)   returns (ListBindingsResponse);
  rpc ListAllBindings(Empty)              returns (ListBindingsResponse);
  rpc DeleteBinding(DeleteBindingRequest) returns (DeleteBindingResponse);

  // Tokens
  rpc IssueToken(IssueTokenRequest)       returns (IssueTokenResponse);
  rpc RevokeToken(RevokeTokenRequest)     returns (RevokeTokenResponse);
}

// ─── Security messages ──────────────────────────────────────────────────────

// Role CRUD

message RoleDefinition {
  string name = 1;
  repeated string permissions = 2;  // e.g. ["Produce", "Consume", "Lookup"]
  bool system = 3;
}

message CreateRoleRequest {
  RoleDefinition role = 1;
}

message CreateRoleResponse {
  bool success = 1;
}

message GetRoleRequest {
  string name = 1;
}

message GetRoleResponse {
  RoleDefinition role = 1;
}

message ListRolesResponse {
  repeated RoleDefinition roles = 1;
}

message DeleteRoleRequest {
  string name = 1;
}

message DeleteRoleResponse {
  bool success = 1;
}

// Binding CRUD

message BindingDefinition {
  string id = 1;
  string principal_type = 2;   // "service_account", "user"
  string principal_name = 3;
  repeated string role_names = 4;
  string scope = 5;            // "cluster", "namespace", "topic"
  string resource_name = 6;    // "" for cluster, namespace name, or topic path
}

message CreateBindingRequest {
  BindingDefinition binding = 1;
}

message CreateBindingResponse {
  bool success = 1;
}

message GetBindingRequest {
  string scope = 1;
  string resource_name = 2;
  string binding_id = 3;
}

message GetBindingResponse {
  BindingDefinition binding = 1;
}

message ListBindingsRequest {
  string scope = 1;           // "cluster", "namespace", "topic"
  string resource_name = 2;   // "" for cluster scope
}

message ListBindingsResponse {
  repeated BindingDefinition bindings = 1;
}

message DeleteBindingRequest {
  string scope = 1;
  string resource_name = 2;
  string binding_id = 3;
}

message DeleteBindingResponse {
  bool success = 1;
}

// Common Messages
message Empty {}

message NamespaceRequest {
  string name = 1;
}

message NamespaceResponse {
  bool success = 1;
}

message NewTopicRequest {
  string name = 1;
  optional string schema_subject = 2;  // Schema subject from Schema Registry (optional: topics can have no schema)
  DispatchStrategy dispatch_strategy = 3;
  optional string intent = 4;          // Optional StreamIntent profile (e.g., agent_event_mesh)
}

message TopicRequest {
  string name = 1;
}

message TopicResponse {
  bool success = 1;
}

message PartitionedTopicRequest {
  string base_name = 1;                    // /namespace/topic
  uint32 partitions = 2;                   // number of partitions
  optional string schema_subject = 3;      // Schema subject from Schema Registry (optional)
  DispatchStrategy dispatch_strategy = 4;
  optional string intent = 5;              // Optional StreamIntent profile
}

message SubscriptionRequest {
  string topic = 1;
  string subscription = 2;
}

message SubscriptionResponse {
  bool success = 1;
}

message SubscriptionFailurePolicy {
  uint32 max_redelivery_count = 1;
  uint64 ack_timeout_ms = 2;
  uint64 base_redelivery_delay_ms = 3;
  uint64 max_redelivery_delay_ms = 4;
  SubscriptionBackoffStrategy backoff_strategy = 5;
  optional string dead_letter_topic = 6;
  SubscriptionPoisonPolicy poison_policy = 7;
}

message SetSubscriptionFailurePolicyRequest {
  string topic = 1;
  string subscription = 2;
  SubscriptionFailurePolicy failure_policy = 3;
}

message GetSubscriptionFailurePolicyRequest {
  string topic = 1;
  string subscription = 2;
}

message GetSubscriptionFailurePolicyResponse {
  optional SubscriptionFailurePolicy failure_policy = 1;
  int32 subscription_type = 2;
}

message SubscriptionDispatchConfig {
  uint32 max_unacked_messages = 1;
}

message SetSubscriptionDispatchConfigRequest {
  string topic = 1;
  string subscription = 2;
  SubscriptionDispatchConfig dispatch_config = 3;
}

message GetSubscriptionDispatchConfigRequest {
  string topic = 1;
  string subscription = 2;
}

message GetSubscriptionDispatchConfigResponse {
  optional SubscriptionDispatchConfig dispatch_config = 1;
}

// Response Messages
message BrokerListResponse {
  repeated BrokerInfo brokers = 1;
}

message BrokerInfo {
  string broker_id = 1;
  string broker_addr = 2;
  string broker_role = 3;
  string admin_addr = 4;
  string metrics_addr = 5;
  string broker_status = 6;
}

message BrokerResponse {
  string leader = 1;
}

message NamespaceListResponse {
  repeated string namespaces = 1;
}

message TopicListResponse {
  repeated string topics = 1;
}

// Detailed topic entry including hosting broker id
message TopicInfo {
  string name = 1;       // /namespace/topic (leading slash)
  string broker_id = 2;  // hosting broker id; empty if unknown/unassigned
  string delivery = 3;   // delivery: Reliable | NonReliable
}

message TopicInfoListResponse {
  repeated TopicInfo topics = 1;
}

// Request to address a specific broker
message BrokerRequest {
  string broker_id = 1;
}

message PolicyResponse {
  string policies = 1;
}

message SubscriptionListResponse {
  repeated string subscriptions = 1;
}

// Describe Topic (schema + subscriptions)
message DescribeTopicRequest {
  string name = 1; // /namespace/topic
}

message DescribeTopicResponse {
  string name = 1;
  repeated string subscriptions = 2;
  string broker_id = 3;
  string delivery = 4;                     // delivery: Reliable | NonReliable
  
  // Schema Registry fields (all optional - topic may have no schema)
  optional string schema_subject = 5;      // Schema subject name
  optional uint64 schema_id = 6;           // Schema ID from registry
  optional uint32 schema_version = 7;      // Schema version
  optional string schema_type = 8;         // "json_schema", "avro", "protobuf", "string", "bytes"
  optional string compatibility_mode = 9;  // "NONE", "BACKWARD", "FORWARD", "FULL"
  optional string intent = 10;             // Resolved StreamIntent summary (if created with --intent)
}

// Broker Unload
message UnloadBrokerRequest {
  // Target broker to unload (string id as published under /cluster/brokers/{broker_id})
  string broker_id = 1;
  // Unload concurrency (default: 1)
  uint32 max_parallel = 2;
  // Optional filters
  repeated string namespaces_include = 3;
  repeated string namespaces_exclude = 4;
  // Dry-run does not perform changes; returns the topics to be affected
  bool dry_run = 5;
  // Per-topic timeout (seconds)
  uint32 timeout_seconds = 6;
}

message UnloadBrokerResponse {
  bool started = 1; // true if accepted/started
  uint32 total = 2;
  uint32 succeeded = 3;
  uint32 failed = 4;
  uint32 pending = 5;
  repeated string failed_topics = 6;
}

// Activate Broker
message ActivateBrokerRequest {
  // Target broker to activate (string id as published under /cluster/brokers/{broker_id})
  string broker_id = 1;
  // Optional reason for auditability
  string reason = 2;
}

message ActivateBrokerResponse {
  bool success = 1;
}

// Load Balancing & Rebalancing (Phase 3)

// Request to get current cluster balance metrics
message ClusterBalanceRequest {}

// Response containing cluster balance metrics
message ClusterBalanceResponse {
  // Coefficient of variation (0.0 = perfectly balanced, higher = more imbalanced)
  double coefficient_of_variation = 1;
  // Mean load across all brokers (typically topic count)
  double mean_load = 2;
  // Maximum load in the cluster
  double max_load = 3;
  // Minimum load in the cluster
  double min_load = 4;
  // Standard deviation of load
  double std_deviation = 5;
  // Number of active brokers
  uint32 broker_count = 6;
  // Detailed broker load information
  repeated BrokerLoadInfo brokers = 7;
  // Assignment strategy currently in use (fair, balanced, weighted_load)
  string assignment_strategy = 8;
}

// Load information for a single broker
message BrokerLoadInfo {
  uint64 broker_id = 1;
  double load = 2;
  uint32 topic_count = 3;
  bool is_overloaded = 4;
  bool is_underloaded = 5;
}

// Request to trigger manual rebalancing
message RebalanceRequest {
  // If true, only calculate and return proposed moves without executing
  bool dry_run = 1;
  // Maximum number of topic moves to execute (default: from config)
  optional uint32 max_moves = 2;
}

// Response from rebalancing operation
message RebalanceResponse {
  // True if rebalancing was successful or dry-run completed
  bool success = 1;
  // Number of moves actually executed (0 for dry-run)
  uint32 moves_executed = 2;
  // Proposed or executed moves
  repeated ProposedMove proposed_moves = 3;
  // Error message if success = false
  string error_message = 4;
}

// A proposed or executed topic move
message ProposedMove {
  string topic_name = 1;
  uint64 from_broker = 2;
  uint64 to_broker = 3;
  double estimated_load = 4;
  string reason = 5;
}

// ─── Cluster Admin messages ─────────────────────────────────────────────────

message ClusterStatusResponse {
  // Current Raft leader node_id (0 if no leader)
  uint64 leader_id = 1;
  // Current Raft term
  uint64 current_term = 2;
  // Last applied log index
  uint64 last_applied = 3;
  // Node IDs of current voters
  repeated uint64 voters = 4;
  // Node IDs of current learners (non-voting)
  repeated uint64 learners = 5;
  // This node's own ID
  uint64 self_node_id = 6;
  // This node's Raft transport address
  string raft_addr = 7;
}

message AddNodeRequest {
  // Raft transport address of the new node, e.g. "broker4:7650"
  string addr = 1;
  // Optional: provide the node_id directly (discovered via transport if omitted)
  uint64 node_id = 2;
}

message AddNodeResponse {
  bool success = 1;
  uint64 node_id = 2;
  string message = 3;
}

message PromoteNodeRequest {
  uint64 node_id = 1;
}

message PromoteNodeResponse {
  bool success = 1;
  string message = 2;
}

message RemoveNodeRequest {
  uint64 node_id = 1;
}

message RemoveNodeResponse {
  bool success = 1;
  string message = 2;
}

// ─── Broker Telemetry & Logs messages ──────────────────────────────────────

message GetBrokerLogsRequest {
  string level = 1;
  string target = 2;
  string contains = 3;
  uint64 since_ms = 4;
  uint32 limit = 5;
}

message BrokerLogEntry {
  uint64 timestamp_ms = 1;
  string level = 2;
  string target = 3;
  string message = 4;
  map<string, string> fields = 5;
}

message GetBrokerLogsResponse {
  uint64 broker_id = 1;
  repeated BrokerLogEntry entries = 2;
  uint64 total_buffered = 3;
}

message GetMetricsSnapshotRequest {
  repeated string metric_names = 1;
  uint32 window_seconds = 2;
}

message MetricSample {
  uint64 timestamp_ms = 1;
  double value = 2;
}

message MetricSeries {
  string name = 1;
  string kind = 2;
  map<string, string> labels = 3;
  double current_value = 4;
  repeated MetricSample history = 5;
}

message GetMetricsSnapshotResponse {
  uint64 broker_id = 1;
  uint64 collected_at_ms = 2;
  repeated MetricSeries series = 3;
}

// ─── Object Store & Declarative Desired State messages ─────────────────────

message ConfigureObjectStoreRequest {
  string backend = 1;
  string root = 2;
  map<string, string> options = 3;
  bool force = 4;
}

message ConfigureObjectStoreResponse {
  bool success = 1;
  string message = 2;
}

message ObjectStoreConfigResponse {
  bool configured = 1;
  string backend = 2;
  string root = 3;
  map<string, string> options = 4;
  uint32 cloud_tiered_topics = 5;
}

message UpdateTopicStorageModeRequest {
  string topic_name = 1;
  string storage_mode = 2;
  bool force = 3;
}

message DesiredStateRequest {
  string manifest = 1;
  bool prune = 2;
  bool force_delete_non_empty = 3;
}

message PlannedAction {
  string kind = 1;
  string resource = 2;
  string details = 3;
}

message DesiredStatePlanResponse {
  repeated PlannedAction actions = 1;
  bool has_destructive_changes = 2;
}

message DesiredStateApplyResponse {
  bool success = 1;
  repeated PlannedAction applied = 2;
  string message = 3;
}

// ─── Elastic Membership, Token & Diagnostic messages ────────────────────────

message JoinClusterRequest {
  uint64 node_id = 1;
  string raft_addr = 2;
  uint32 target_voter_count = 3;
}

message JoinClusterResponse {
  bool success = 1;
  bool promoted_to_voter = 2;
  string role = 3;
  string message = 4;
}

message IssueTokenRequest {
  string subject = 1;
  string principal_type = 2;
  uint64 ttl_seconds = 3;
}

message IssueTokenResponse {
  string token = 1;
  uint64 expires_at = 2;
}

message RevokeTokenRequest {
  string subject = 1;
}

message RevokeTokenResponse {
  bool success = 1;
  string message = 2;
}

message PeekMessagesRequest {
  string topic = 1;
  uint64 start_offset = 2;
  uint32 count = 3;
}

message PeekedMessage {
  uint64 offset = 1;
  uint64 publish_time = 2;
  string producer_name = 3;
  bytes payload = 4;
  map<string, string> attributes = 5;
  string routing_key = 6;
}

message PeekMessagesResponse {
  string topic = 1;
  repeated PeekedMessage messages = 2;
}

message GetTopicTimeRangeResponse {
  string topic = 1;
  bool has_messages = 2;
  uint64 min_offset = 3;
  uint64 max_offset = 4;
  uint64 earliest_publish_time = 5;
  uint64 latest_publish_time = 6;
}

message SampleTopicJsonRequest {
  string topic = 1;
  uint32 count = 2;
}

message SampleTopicJsonResponse {
  string topic = 1;
  repeated string json_samples = 2;
}

message ExplainConsumerStallRequest {
  string topic = 1;
  string subscription = 2;
}

message ExplainConsumerStallResponse {
  string topic = 1;
  string subscription = 2;
  string status = 3;
  uint64 consumer_count = 4;
  uint64 backlog = 5;
  uint64 in_flight_count = 6;
  bool ack_timeout_pending = 7;
  string diagnosis = 8;
  repeated string suggestions = 9;
}

message InferTopicSchemaRequest {
  string topic = 1;
  uint32 sample_size = 2;
}

message InferTopicSchemaResponse {
  string topic = 1;
  string json_schema = 2;
  uint32 sampled_count = 3;
  uint32 valid_json_count = 4;
}

message BranchTopicRequest {
  string source_topic = 1;
  string target_topic = 2;
  optional uint64 at_offset = 3;
  optional uint64 at_timestamp_ns = 4;
}

message BranchTopicResponse {
  bool success = 1;
  string source_topic = 2;
  string target_topic = 3;
  uint64 branched_up_to_offset = 4;
  uint32 copied_segments = 5;
  uint64 copied_local_messages = 6;
}

message SeekSubscriptionRequest {
  string topic = 1;
  string subscription = 2;
  optional uint64 to_offset = 3;
  optional uint64 to_timestamp_ns = 4;
}

message SeekSubscriptionResponse {
  bool success = 1;
  string topic = 2;
  string subscription = 3;
  uint64 resolved_offset = 4;
  string message = 5;
}

message ReplayDlqRequest {
  string topic = 1;
  string subscription = 2;
  optional string dlq_topic = 3;
  uint32 max_messages = 4;
  uint64 start_offset = 5;
}

message ReplayDlqResponse {
  bool success = 1;
  string source_dlq_topic = 2;
  string target_topic = 3;
  uint32 replayed_count = 4;
  uint64 last_replayed_offset = 5;
}