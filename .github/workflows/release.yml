name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev protobuf-compiler

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --features danube-broker/lakehouse --target x86_64-unknown-linux-gnu

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: danube-binaries-linux
          path: |
            target/x86_64-unknown-linux-gnu/release/danube

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install pkg-config openssl protobuf

      - name: Set up Rust for Apple Silicon
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Build for Apple Silicon
        run: cargo build --release --features danube-broker/lakehouse --target aarch64-apple-darwin

      - name: Upload MacOS Apple Silicon binary
        uses: actions/upload-artifact@v4
        with:
          name: danube-binaries-macos
          path: |
            target/aarch64-apple-darwin/release/danube

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          choco install protoc
          
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build for Windows
        run: cargo build --release --features danube-broker/lakehouse --target x86_64-pc-windows-msvc

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: danube-binaries-windows
          path: |
            target/x86_64-pc-windows-msvc/release/danube.exe

  docker-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Danube
        id: meta-danube
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/danube
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=true

      - name: Build and push Danube image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/danube:${{ github.ref_name }}-${{ matrix.arch }}
            ghcr.io/${{ github.repository_owner }}/danube:latest-${{ matrix.arch }}
          labels: ${{ steps.meta-danube.outputs.labels }}
          cache-from: type=gha,scope=danube-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=danube-${{ matrix.arch }}

  docker-manifest:
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/danube"

          docker buildx imagetools create \
            -t ${IMAGE}:${TAG} \
            -t ${IMAGE}:latest \
            ${IMAGE}:${TAG}-amd64 \
            ${IMAGE}:${TAG}-arm64

  release:
    needs: [build-linux, build-macos, build-windows, docker-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
      deployments: read
      issues: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: danube-binaries-linux
          path: artifacts/linux/

      - name: Download MacOS binaries
        uses: actions/download-artifact@v4
        with:
          name: danube-binaries-macos
          path: artifacts/macos/

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: danube-binaries-windows
          path: artifacts/windows/

      - name: Prepare release assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release

          # --- Linux (x86_64) ---
          ARCHIVE="danube-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          chmod +x "artifacts/linux/danube"
          tar czf "release/${ARCHIVE}" -C artifacts/linux danube

          # --- macOS (Apple Silicon) ---
          ARCHIVE="danube-${VERSION}-aarch64-apple-darwin.tar.gz"
          chmod +x "artifacts/macos/danube"
          tar czf "release/${ARCHIVE}" -C artifacts/macos danube

          # --- Windows (x86_64) ---
          ARCHIVE="danube-${VERSION}-x86_64-pc-windows-msvc.zip"
          (cd artifacts/windows && zip -q "../../release/${ARCHIVE}" "danube.exe")

          # Generate checksums
          cd release
          sha256sum * > checksums.txt

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          test -f CHANGELOG.md || { echo "CHANGELOG.md not found"; exit 1; }
          # Extract block between markers and drop the markers themselves
          sed -n '/<!-- '"${TAG}"' START -->/,/<!-- '"${TAG}"' END -->/p' CHANGELOG.md \
            | sed '1d;$d' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No notes found for ${TAG} in CHANGELOG.md" >&2
            exit 1
          fi

      - name: Compose release body
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          cat > RELEASE_STATIC.md <<EOF
          ## Release Notes - Binaries

          ## Unified Danube Server (\`danube\` — Broker + Raft + Edge + Lakehouse + \`danube ctl\` + \`danube mcp\`):
          - **Linux (x86_64)**: [danube-${VERSION}-x86_64-unknown-linux-gnu.tar.gz](https://github.com/${{ github.repository }}/releases/download/${VERSION}/danube-${VERSION}-x86_64-unknown-linux-gnu.tar.gz)
          - **macOS (Apple Silicon)**: [danube-${VERSION}-aarch64-apple-darwin.tar.gz](https://github.com/${{ github.repository }}/releases/download/${VERSION}/danube-${VERSION}-aarch64-apple-darwin.tar.gz)
          - **Windows (x86_64)**: [danube-${VERSION}-x86_64-pc-windows-msvc.zip](https://github.com/${{ github.repository }}/releases/download/${VERSION}/danube-${VERSION}-x86_64-pc-windows-msvc.zip)

          ## Checksums:
          - **SHA256**: [checksums.txt](https://github.com/${{ github.repository }}/releases/download/${VERSION}/checksums.txt)
          
          ## Docker Image:
          - **Danube**: \`ghcr.io/${{ github.repository_owner }}/danube:${VERSION}\`
          
          ### Quick Start with Docker:
          \`\`\`bash
          # Run Danube Broker (zero-YAML)
          docker run -p 6650:6650 ghcr.io/${{ github.repository_owner }}/danube:${VERSION}
          
          # Use Danube CLI
          docker run --rm ghcr.io/${{ github.repository_owner }}/danube:${VERSION} ctl brokers list
          docker run --rm ghcr.io/${{ github.repository_owner }}/danube:${VERSION} ctl produce --help
          
          # Use with Docker Compose
          curl -O https://raw.githubusercontent.com/${{ github.repository }}/main/docker/docker-compose.yml
          docker-compose up -d
          \`\`\`

          ### Install from Archive:
          \`\`\`bash
          # Linux
          curl -LsS https://github.com/${{ github.repository }}/releases/download/${VERSION}/danube-${VERSION}-x86_64-unknown-linux-gnu.tar.gz | tar xz
          sudo mv danube /usr/local/bin/

          # macOS (Apple Silicon)
          curl -LsS https://github.com/${{ github.repository }}/releases/download/${VERSION}/danube-${VERSION}-aarch64-apple-darwin.tar.gz | tar xz
          sudo mv danube /usr/local/bin/

          # Windows (PowerShell)
          Invoke-WebRequest -Uri https://github.com/${{ github.repository }}/releases/download/${VERSION}/danube-${VERSION}-x86_64-pc-windows-msvc.zip -OutFile danube.zip
          Expand-Archive danube.zip -DestinationPath .
          Move-Item danube.exe C:\\Windows\\System32\\
          \`\`\`
          
          ### Verify Downloads:
          \`\`\`bash
          curl -LO https://github.com/${{ github.repository }}/releases/download/${VERSION}/checksums.txt
          sha256sum -c checksums.txt --ignore-missing
          \`\`\`
          EOF
          # Combine CHANGELOG section + static info
          cat RELEASE_NOTES.md RELEASE_STATIC.md > RELEASE_BODY.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: release/*
          body_path: RELEASE_BODY.md

