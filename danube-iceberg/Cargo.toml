[package]
name = "danube-iceberg"
version = "0.16.0"
description = "Lakehouse Iceberg/Parquet sink for Danube messaging"
authors = ["Dan Rusei <dan.rusei@gmail.com>"]
repository = "https://github.com/danube-messaging/danube"
readme = "README.md"
license = "Apache-2.0"
edition = "2021"

[features]
default = ["rest"]
rest = ["dep:iceberg-catalog-rest", "dep:iceberg-storage-opendal"]
aws = ["rest", "dep:iceberg-catalog-glue", "dep:iceberg-catalog-s3tables"]

[dependencies]
# Danube crates (frame decoding + proto types + schema registry client)
danube-core = { path = "../danube-core" }
danube-client = { path = "../danube-client" }
danube-persistent-storage = { path = "../danube-persistent-storage" }

# Iceberg (catalog integration + table management — feature-gated backends)
iceberg = "0.10.1"
iceberg-catalog-rest = { version = "0.10.1", optional = true }
iceberg-catalog-glue = { version = "0.10.1", optional = true }
iceberg-catalog-s3tables = { version = "0.10.1", optional = true }
iceberg-storage-opendal = { version = "0.10.1", optional = true }

# Arrow/Parquet (aligned with iceberg 0.10.1's arrow 58 release train)
arrow-array = "58"
arrow-schema = "58"
arrow-cast = "58"
arrow-json = "58"
arrow-avro = "58"
parquet = { version = "58", default-features = false, features = ["arrow", "zstd", "async", "object_store"] }

# Storage (parquet 58 depends on object_store 0.13.2)
object_store = { version = "0.13", features = ["aws", "gcp", "azure"] }

# Runtime
tokio = { workspace = true }
tonic = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
tracing = { workspace = true }
bincode = { version = "2.0.1", features = ["serde"] }
bytes = { workspace = true }
chrono = { version = "0.4", features = ["clock"] }
metrics = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
crc32fast = "1"
tokio-stream = { workspace = true }
futures-util = { workspace = true }
apache-avro = "0.21"

[lints]
workspace = true
